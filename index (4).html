async function storeAsset(e,c,kind){let file=e.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){alert('Use PNG, JPG or WebP images.');return}if(file.size>20*1024*1024){alert('Maximum image size is 20 MB');return}try{await putFile(c.id+':'+kind,file);c[kind+'Name']=file.name;save();detail(c.id)}catch(err){alert('Could not save file: '+err.message)}}
async function loadRequestReferences(c){const holder=$('#requestReferences');if(!holder||!c.referenceNames?.length)return;const heading=document.createElement('div');heading.className='eyebrow';heading.style.marginTop='20px';heading.textContent='CLIENT REFERENCE IMAGES · '+c.referenceNames.length;holder.appendChild(heading);const grid=document.createElement('div');grid.className='ref-grid';holder.appendChild(grid);for(let i=0;i<c.referenceNames.length;i++){const file=await getFile(c.id+':ref:'+i).catch(()=>null);if(!file||!grid.isConnected)continue;const url=URL.createObjectURL(file);const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';link.className='ref-item';link.title='Open full image';const img=document.createElement('img');img.src=url;img.alt='Reference '+(i+1);const name=document.createElement('small');name.textContent=c.referenceNames[i];link.append(img,name);grid.appendChild(link)}}
async function loadAssets(c){let photo=await getFile(c.id+':photo').catch(()=>null);let holder=$('#photoHolder');if(holder&&photo){let url=URL.createObjectURL(photo);let img=document.createElement('img');img.className='photoPreview';img.alt='Submitted preview photo';img.src=url;img.onload=()=>URL.revokeObjectURL(url);holder.appendChild(img)}let texture=await getFile(c.id+':texture').catch(()=>null);let tex=$('#textureHolder');if(tex&&texture){tex.textContent='◩ Texture attached: '+texture.name+' · Applied to 3D preview where supported.'}}
function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open('vsleazy-luxe-assets-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function putFile(id,file){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(file,id);t.oncomplete=()=>{d.close();res()};t.onerror=()=>{d.close();rej(t.error)}})}async function getFile(id){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('files','readonly'),r=t.objectStore('files').get(id);r.onsuccess=()=>{d.close();res(r.result)};r.onerror=()=>{d.close();rej(r.error)}})}
async function loadModel(id){if(viewerCleanup){viewerCleanup();viewerCleanup=null}const el=$('#viewer');if(!el)return;let file=await getFile(id).catch(()=>null);if(!$('#viewer')||$('#viewer')!==el)return;if(!file){el.innerHTML='<div style="height:100%;display:grid;place-items:center;color:#8c9bb3;text-align:center">◈<br>No model uploaded yet</div>';return}let url=URL.createObjectURL(file),renderer,controls,raf,ro;try{let scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,el.clientWidth/el.clientHeight,.01,10000);renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(el.clientWidth,el.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;el.innerHTML='';el.appendChild(renderer.domElement);let ambient=new THREE.HemisphereLight(0xe5edff,0x253049,2.5);scene.add(ambient);let light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(3,6,7);scene.add(light);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let ext=file.name.split('.').pop().toLowerCase(),obj;if(ext==='glb'||ext==='gltf'){obj=(await new GLTFLoader().loadAsync(url)).scene}else if(ext==='obj'){obj=new OBJLoader().parse(await file.text())}else{let geometry=new STLLoader().parse(await file.arrayBuffer());geometry.computeVertexNormals();obj=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:0xb2bfd5,metalness:.25,roughness:.58,side:THREE.DoubleSide}))}let textureFile=await getFile(id+':texture').catch(()=>null);if(textureFile){let textureURL=URL.createObjectURL(textureFile);try{let tex=await new THREE.TextureLoader().loadAsync(textureURL);tex.colorSpace=THREE.SRGBColorSpace;tex.flipY=ext==='glb'||ext==='gltf'?false:true;obj.traverse(node=>{if(node.isMesh){const apply=m=>{let copy=m.clone();copy.map=tex;copy.needsUpdate=true;return copy};node.material=Array.isArray(node.material)?node.material.map(apply):apply(node.material)}})}catch(err){console.warn('Texture preview unavailable',err)}finally{URL.revokeObjectURL(textureURL)}}scene.add(obj);let box=new THREE.Box3().setFromObject(obj);if(box.isEmpty())throw Error('Model has no geometry');let center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),max=Math.max(size.x,size.y,size.z)||1;obj.position.sub(center);let dist=max/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.65;camera.position.set(dist*.7,dist*.45,dist);camera.near=Math.max(.001,dist/1000);camera.far=dist*100;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.update();const tick=()=>{raf=requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)};tick();ro=new ResizeObserver(()=>{if(!el.isConnected)return;camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight)});ro.observe(el);viewerCleanup=()=>{cancelAnimationFrame(raf);ro.disconnect();controls.dispose();scene.traverse(o=>{o.geometry?.dispose();if(o.material){let mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>m.dispose())}});renderer.dispose();URL.revokeObjectURL(url)}}catch(e){if(renderer)renderer.dispose();if(ro)ro.disconnect();URL.revokeObjectURL(url);el.innerHTML=`<div style="padding:30px;color:#aab7cb">Could not preview model: ${escapeHTML(e.message)}<br><br>For GLTF, use a self-contained GLB file if external textures or geometry are required.</div>`}}
render();
</script></body></html>
