async function edge(fn,payload){const {data:{session}}=await supabase.auth.getSession();const headers={'Content-Type':'application/json','apikey':KEY};if(actor?.role==='owner'&&session?.access_token)headers.Authorization='Bearer '+session.access_token;const response=await fetch(`${URL}/functions/v1/${fn}`,{method:'POST',headers,body:JSON.stringify(actor?.role==='client'?{...payload,client_token:clientToken}:payload)});let result;try{result=await response.json()}catch{throw Error(`API returned HTTP ${response.status}`)}if(!response.ok||result?.error)throw Error(result?.error||`HTTP ${response.status}`);return result}
async function access(action,more={}){const response=await fetch(`${URL}/functions/v1/client-access-v2`,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,...more})});const data=await response.json();if(!response.ok||data.error)throw Error(data.error||`HTTP ${response.status}`);return data}
function renderPayments(){
const s=paymentSettings||{};
const safe=(v)=>esc(v||'Not configured');
const cards=[['PayPal',s.paypal],['Crypto wallet',s.crypto_address],['Network',s.crypto_network],['Roblox username',s.roblox_username]];
$('#content').innerHTML=`<div class="sectionhead"><h2>Payment options</h2><span class="muted">Payment details for commissions</span></div><div class="paygrid">${cards.map(([title,value])=>`<div class="glass payitem"><small>${esc(title)}</small><strong>${safe(value)}</strong>${value?`<button class="outline" data-copy="${esc(title)}">Copy</button>`:''}</div>`).join('')}</div><p class="notice">Payment instructions are displayed here. Payments are not processed or automatically verified by this website. Only the owner can confirm a payment.</p>${actor.role==='owner'?`<div class="glass panel"><h2>Edit payment details</h2><form id="payForm"><div class="fields"><div class="field"><label>PayPal link or handle</label><input class="input" name="paypal" maxlength="240" value="${esc(s.paypal||'')}" placeholder="PayPal.me link"></div><div class="field"><label>Roblox username</label><input class="input" name="roblox_username" maxlength="80" value="${esc(s.roblox_username||'')}"></div><div class="field"><label>Crypto wallet address</label><input class="input" name="crypto_address" maxlength="240" value="${esc(s.crypto_address||'')}"></div><div class="field"><label>Crypto network (important)</label><input class="input" name="crypto_network" maxlength="80" value="${esc(s.crypto_network||'')}"></div></div><button class="btn">Save payment details</button></form></div>`:''}`;
for(const b of document.querySelectorAll('[data-copy]'))b.onclick=async()=>{const name=b.dataset.copy;const val=cards.find(c=>c[0]===name)?.[1];if(val){await navigator.clipboard.writeText(val);b.textContent='Copied ✓'}};
if($('#payForm'))$('#payForm').onsubmit=async e=>{e.preventDefault();try{const d=new FormData(e.target);const payload={action:'payment_settings',mode:'save'};for(const key of ['paypal','roblox_username','crypto_address','crypto_network'])payload[key]=d.get(key)||'';const r=await edge('commission-api',payload);paymentSettings=r.settings;renderPayments()}catch(err){message(err)}};
}
function renderPartners(){
const approved=clients.filter(c=>c.status==='approved');
$('#content').innerHTML=`<div class="sectionhead"><h2>Partner studios</h2><button class="btn" id="addGroup">+ Create partner group</button></div><p class="sub">Each partner group has its own commission inbox. Clients can belong to multiple groups, but each client only sees their own commissions.</p>${groups.map(g=>{const ids=members.filter(m=>m.group_id===g.id).map(m=>m.client_id);const jobs=commissions.filter(c=>c.partner_group_id===g.id);return `<section class="glass panel" style="margin-bottom:20px"><div class="row"><div><div class="eyebrow">PARTNER STUDIO</div><h2>${esc(g.name)}</h2><span class="muted">${ids.length} members · ${jobs.length} commissions</span></div><button class="outline" data-delete-group="${g.id}">Delete group</button></div><div class="group-members">${ids.map(id=>`<button class="outline" data-remove-member="${g.id}:${id}">${esc(clientName(id))} ×</button>`).join('')||'<span class="muted">No members yet</span>'}</div><div class="toolbar"><select class="input" data-member-select="${g.id}" style="max-width:320px"><option value="">Select approved client</option>${approved.filter(c=>!ids.includes(c.id)).map(c=>`<option value="${c.id}">${esc(c.username)}</option>`).join('')}</select><button class="btn" data-add-member="${g.id}">+ Add client</button></div><div class="sectionhead"><h2>Group commission inbox</h2><span class="muted">${jobs.length} items</span></div><div class="grid">${jobs.map(card).join('')||'<div class="glass empty">No commissions in this group yet</div>'}</div></section>`}).join('')||'<div class="glass empty">Create a partner group to collect requests from multiple clients.</div>'}`;
$('#addGroup').onclick=async()=>{const name=prompt('Partner group name');if(!name)return;try{await edge('commission-api',{action:'group_create',name:name.trim()});await refresh()}catch(err){message(err)}};
document.querySelectorAll('[data-add-member]').forEach(b=>b.onclick=async()=>{const group_id=b.dataset.addMember;const client_id=document.querySelector(`[data-member-select="${group_id}"]`)?.value;if(!client_id)return;try{await edge('commission-api',{action:'group_member',mode:'add',group_id,client_id});await refresh()}catch(err){message(err)}});
document.querySelectorAll('[data-remove-member]').forEach(b=>b.onclick=async()=>{const [group_id,client_id]=b.dataset.removeMember.split(':');try{await edge('commission-api',{action:'group_member',mode:'remove',group_id,client_id});await refresh()}catch(err){message(err)}});
document.querySelectorAll('[data-delete-group]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this group? Existing commissions will remain but lose the group label.'))return;try{await edge('commission-api',{action:'group_delete',group_id:b.dataset.deleteGroup});await refresh()}catch(err){message(err)}});
wire();
}
async function bootstrap(){busy('Opening studio…');try{const {data:{session}}=await supabase.auth.getSession();if(session){const {data:p}=await supabase.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(p?.role==='owner'){actor={role:'owner'};user=session.user;await refresh();return}}if(clientToken){const result=await access('check',{token:clientToken});if(result.approved&&result.client_id){actor={role:'client',id:result.client_id,username:result.username};await refresh();return}if(result.status==='pending'){login('pending');return}}login()}catch(e){login();console.error(e)}}
function login(info=''){$('#app').innerHTML=`<div class="shell"><div class="glass login"><div class="brand">vSLEAZY<span> / ATELIER</span></div><p class="eyebrow" style="margin-top:34px">PRIVATE COMMISSION STUDIO</p><h1>Digital craft,<br>considered.</h1><p class="sub">Your private space for UGC requests, 3D deliveries and approvals.</p><div class="field"><label>Client username</label><input id="username" class="input" maxlength="70" placeholder="Your username"></div><button id="request" class="btn">Request client access →</button>${clientToken?'<button id="check" class="outline" style="width:100%;margin-top:12px">Check approval status</button>':''}<p class="notice" style="margin-top:18px" id="loginMsg">${info==='pending'?'Your request is pending owner approval.':'Clients only need a username. Access requires owner approval and is remembered on this browser.'}</p><div style="margin-top:24px;border-top:1px solid #ffffff1a;padding-top:20px"><button id="owner" class="ghost">Owner sign in ↗</button></div></div></div>`;
$('#request').onclick=async()=>{try{const username=$('#username').value.trim();if(username.length<2)throw Error('Enter a username of at least 2 characters');const result=await access('request',{username});const t=result.token||result.client_token||result.request_token;if(!t)throw Error('Access request was sent but no token was returned. Contact the owner.');clientToken=t;localStorage.setItem(tokenKey,t);login('pending')}catch(e){message(e)}};
if($('#check'))$('#check').onclick=bootstrap;
$('#owner').onclick=ownerLogin}
function ownerLogin(){show(`<h2>Owner sign in</h2><form id="ownerForm"><div class="field"><label>Email</label><input class="input" type="email" name="email" required></div><div class="field"><label>Password</label><input class="input" type="password" name="password" required></div><div class="actions"><button type="button" data-close class="outline">Cancel</button><button class="btn">Sign in →</button></div></form>`);$('#ownerForm').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target);const {error}=await supabase.auth.signInWithPassword({email:d.get('email'),password:d.get('password')});if(error)return message(error);close();await bootstrap()}}
async function refresh(){try{if(actor.role==='owner'){const {data,error}=await supabase.from('client_requests').select('id,username,status,created_at').order('created_at',{ascending:false});if(error)throw error;clients=data||[]}const result=await edge('commission-api',{action:'list'});commissions=result.commissions||[];
const [groupResult,payResult]=await Promise.all([edge('commission-api',{action:'groups'}),edge('commission-api',{action:'payment_settings'})]);
groups=groupResult.groups||[];members=groupResult.members||[];paymentSettings=payResult.settings||{};render()}catch(e){busy('Unable to load commissions: '+e.message);console.error(e)}}
const visible=()=>actor.role==='client'?commissions:focus==='all'?commissions:commissions.filter(c=>c.client_id===focus);
function card(c){return `<article class="glass card"><div class="cardtop"><span class="eyebrow">${esc(clientName(c.client_id))}</span><span class="pill">${esc(statusName(c.status))}</span></div><h3>${esc(c.title)}</h3><p>${esc(c.description||'No description')}</p><div class="row cardfooter"><strong class="price">${c.status==='requested'&&!Number(c.price)?'Quote pending':fmt(c.price,c.currency)}</strong><button class="outline" data-open="${esc(c.id)}">Open ↗</button></div><div style="margin-top:12px"><span class="pill ${c.payment_status==='paid'?'paid':'pending'}">${esc(c.payment_status.replaceAll('_',' '))}</span></div></article>`}
function wire(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>detail(b.dataset.open))}
function render(){clean();const list=visible(),owner=actor.role==='owner';$('#app').innerHTML=`<div class="shell"><header class="top glass"><div class="brand">vSLEAZY<span> / ATELIER</span></div><nav class="nav"><button data-tab="dashboard" class="${tab==='dashboard'?'active':''}">Overview</button><button data-tab="commissions" class="${tab==='commissions'?'active':''}">Commissions</button><button data-tab="models" class="${tab==='models'?'active':''}">3D models</button><button data-tab="payments" class="${tab==='payments'?'active':''}">Payments</button>${!owner&&groups.length?`<button data-tab="my-partners" class="${tab==='my-partners'?'active':''}">Partners</button>`:''}${owner?`<button data-tab="clients" class="${tab==='clients'?'active':''}">Clients</button><button data-tab="partners" class="${tab==='partners'?'active':''}">Partners</button>`:''}</nav><div class="right"><span class="tag">${owner?'OWNER':'CLIENT'}</span><button id="logout" class="outline">Exit ↗</button></div></header><section class="hero"><div><div class="eyebrow">PRIVATE WORKSPACE / ${owner?'ARTIST':esc(actor.username)}</div><h1>${tab==='dashboard'?'Your work, <em>in focus.</em>':tab==='clients'?'Your <em>clients.</em>':tab==='models'?'The <em>model room.</em>':tab==='partners'?'Partner <em>studios.</em>':tab==='payments'?'Payment <em>desk.</em>':'All <em>commissions.</em>'}</h1><div class="sub">A private atelier for digital commissions.</div></div><button class="btn" id="new">${owner?'+ New commission':'+ Request UGC'}</button></section><main id="content"></main><div class="foot">vSleazy’s Commissions / Independent digital atelier / USD & Robux</div></div>`;
$('#logout').onclick=async()=>{if(owner)await supabase.auth.signOut();else{localStorage.removeItem(tokenKey);clientToken=null}actor=null;clients=[];commissions=[];login()};$('#new').onclick=()=>owner?newCommission():newRequest();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if(tab==='payments'){renderPayments();return}
if(tab==='my-partners'&&!owner){const jobs=commissions.filter(c=>c.partner_group_id&&groups.some(g=>g.id===c.partner_group_id));$('#content').innerHTML=`<div class="sectionhead"><h2>Your partner commissions</h2><span class="muted">${jobs.length} requests</span></div><div class="grid">${jobs.map(card).join('')||'<div class="glass empty">No partner commissions yet. Use Request UGC and choose a partner studio.</div>'}</div>`;wire();return}
if(tab==='partners'&&owner){renderPartners();return}
if(tab==='clients'&&owner){const pending=clients.filter(c=>c.status==='pending');$('#content').innerHTML=`<div class="sectionhead"><h2>Pending access requests (${pending.length})</h2></div><div class="grid">${pending.map(c=>`<article class="glass card"><h3>${esc(c.username)}</h3><div class="row"><button class="btn" data-approve="${c.id}">Approve</button><button class="outline" data-reject="${c.id}">Reject</button></div></article>`).join('')||'<div class="glass empty">No pending requests</div>'}</div><div class="sectionhead"><h2>Client directory</h2></div><div class="grid">${clients.map(c=>`<article class="glass card"><h3>${esc(c.username)}</h3><p>${esc(c.status)}</p><button class="outline" data-client="${c.id}">View commissions ↗</button></article>`).join('')}</div>`;document.querySelectorAll('[data-approve],[data-reject]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.approve||b.dataset.reject;const {error}=await supabase.from('client_requests').update({status:b.dataset.approve?'approved':'rejected'}).eq('id',id);if(error)throw error;await refresh()}catch(e){message(e)}});document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>{focus=b.dataset.client;tab='commissions';render()});return}
if(owner){const picker=`<div class="toolbar" style="margin-bottom:20px"><label style="margin:0">View client</label><select class="input" id="filter" style="max-width:300px"><option value="all">All clients</option>${clients.filter(c=>c.status==='approved').map(c=>`<option value="${c.id}" ${focus===c.id?'selected':''}>${esc(c.username)}</option>`).join('')}</select></div>`;$('#content').innerHTML=picker+'<div id="board"></div>';$('#filter').onchange=e=>{focus=e.target.value;render()}}else $('#content').innerHTML='<div id="board"></div>';
const target=$('#board');if(tab==='dashboard'){target.innerHTML=`<div class="stats"><div class="glass stat"><small>Total commissions</small><strong>${list.length}</strong></div><div class="glass stat"><small>Awaiting review</small><strong>${list.filter(c=>c.status==='submitted').length}</strong></div><div class="glass stat"><small>Unpaid · USD</small><strong>${fmt(list.filter(c=>c.currency==='USD'&&c.payment_status!=='paid').reduce((a,c)=>a+Number(c.price),0),'USD')}</strong></div><div class="glass stat"><small>Unpaid · Robux</small><strong>${fmt(list.filter(c=>c.currency==='ROBUX'&&c.payment_status!=='paid').reduce((a,c)=>a+Number(c.price),0),'ROBUX')}</strong></div></div><div class="sectionhead"><h2>Recent commissions</h2></div><div class="grid">${list.slice(0,6).map(card).join('')||'<div class="glass empty">No commissions yet</div>'}</div>`}else{const items=tab==='models'?list.filter(c=>c.status!=='requested'):list;target.innerHTML=`<div class="sectionhead"><h2>${tab==='models'?'3D deliverables':'Commission board'}</h2><span class="muted">${items.length} items</span></div><div class="grid">${items.map(card).join('')||'<div class="glass empty">No commissions yet</div>'}</div>`}wire()}
function newRequest(){show(`<h2>Request a UGC</h2><form id="requestForm"><div class="field"><label>UGC name</label><input class="input" name="title" maxlength="100" required></div><div class="field"><label>Description</label><textarea name="description" maxlength="1500" required></textarea></div><div class="field"><label>Currency</label><select class="input" name="currency"><option value="ROBUX">Robux</option><option value="USD">USD</option></select></div><div class="field"><label>Partner studio (optional)</label><select class="input" name="partner_group_id"><option value="">Personal commission</option>${groups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</select></div><div class="field"><label>Reference images (up to 12)</label><input class="input" type="file" name="refs" multiple accept="image/png,image/jpeg,image/webp"></div><div class="actions"><button class="outline" type="button" data-close>Cancel</button><button class="btn">Send request →</button></div></form>`);$('#requestForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{const d=new FormData(e.target);const created=await edge('commission-api',{action:'create',title:d.get('title'),description:d.get('description'),currency:d.get('currency'),partner_group_id:d.get('partner_group_id')||null});const fs=[...$('#requestForm [name=refs]').files];if(fs.length>12)throw Error('Maximum 12 reference images');for(const f of fs)await upload(created.commission.id,'reference',f);close();tab='commissions';await refresh()}catch(err){message(err)}finally{btn.disabled=false}}}
function newCommission(){const approved=clients.filter(c=>c.status==='approved');if(!approved.length){tab='clients';render();return alert('Approve a client first.')}show(`<h2>New commission</h2><form id="newForm"><div class="field"><label>Title</label><input class="input" name="title" maxlength="100" required></div><div class="field"><label>Client</label><select class="input" name="client_id">${approved.map(c=>`<option value="${c.id}">${esc(c.username)}</option>`).join('')}</select></div><div class="field"><label>Description</label><textarea name="description" maxlength="1500"></textarea></div><div class="field"><label>Partner studio (optional)</label><select class="input" name="partner_group_id" id="newGroup"><option value="">Personal commission</option>${groups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</select></div><div class="fields"><div class="field"><label>Currency</label><select class="input" name="currency"><option value="ROBUX">Robux</option><option value="USD">USD</option></select></div><div class="field"><label>Price</label><input class="input" type="number" name="price" min="0" step="0.01" required></div></div><div class="actions"><button type="button" class="outline" data-close>Cancel</button><button class="btn">Create →</button></div></form>`);$('#newForm').onsubmit=async e=>{e.preventDefault();try{const d=new FormData(e.target);await edge('commission-api',{action:'create',title:d.get('title'),client_id:d.get('client_id'),description:d.get('description'),currency:d.get('currency'),price:Number(d.get('price')),partner_group_id:d.get('partner_group_id')||null});close();tab='commissions';await refresh()}catch(err){message(err)}}}
async function upload(id,kind,file){const mime=file.type||({glb:'model/gltf-binary',gltf:'model/gltf+json',obj:'model/obj',stl:'model/stl'}[file.name.split('.').pop().toLowerCase()]||'application/octet-stream');const r=await edge('commission-files-api',{action:'upload_url',commission_id:id,file_type:kind,file_name:file.name,mime_type:mime,size_bytes:file.size});const {error}=await supabase.storage.from('commission-files').uploadToSignedUrl(r.upload_path,r.upload_token,file,{contentType:mime});if(error)throw error;return r.file}
async function detail(id){const c=commissions.find(x=>x.id===id);if(!c)return;const owner=actor.role==='owner';show(`<div class="row"><h2>${esc(c.title)}</h2><button class="outline" data-close>✕</button></div><div class="detail"><div><div id="viewer" class="viewer"><div class="viewerhint">Drag to rotate · Scroll to zoom</div></div><div id="assets" style="margin-top:18px"></div>${owner?`<div class="assetrow"><label>◈ 3D model<input type="file" data-upload="3d_model" accept=".glb,.gltf,.obj,.stl"><small>GLB / OBJ / STL</small></label><label>▧ Preview<input type="file" data-upload="preview" accept="image/png,image/jpeg,image/webp"><small>PNG / JPG</small></label><label>◩ Texture<input type="file" data-upload="texture" accept="image/png,image/jpeg,image/webp"><small>PNG / JPG</small></label></div>`:''}</div><div><div class="glass" style="margin-bottom:14px"><div class="eyebrow">PROJECT DETAILS</div><p>${esc(c.description||'No description')}</p><p><strong>${fmt(c.price,c.currency)}</strong></p><p class="muted">Status: ${esc(statusName(c.status))}</p><p class="muted">Payment: ${esc(c.payment_status.replaceAll('_',' '))}</p>${c.partner_group_id?`<p class="muted">Partner studio: ${esc(groups.find(g=>g.id===c.partner_group_id)?.name||'Partner group')}</p>`:''}<button class="outline" id="showPayment" style="margin-top:12px">Payment options ↗</button></div><div class="glass"><div class="eyebrow">WORKFLOW</div><div id="actions" style="margin-top:15px"></div></div></div></div>`);$('#showPayment').onclick=()=>{close();tab='payments';render()};const actions=$('#actions');if(owner){actions.innerHTML=`<div class="field"><label>Price</label><input id="editPrice" class="input" type="number" min="0" step="0.01" value="${Number(c.price)}"></div><button class="outline" data-action="price">Save quote</button><div class="field" style="margin-top:14px"><label>Commission status</label><select class="input" id="editStatus">${['requested','in_progress','submitted','revision_requested','approved','completed'].map(s=>`<option value="${s}" ${c.status===s?'selected':''}>${statusName(s)}</option>`).join('')}</select></div><button class="btn" data-action="status">Update status</button><div class="field" style="margin-top:14px"><label>Payment status</label><select class="input" id="editPayment">${['unpaid','payment_sent','paid'].map(s=>`<option value="${s}" ${c.payment_status===s?'selected':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select></div><button class="outline" data-action="payment">Update payment</button><p style="margin-top:25px"><button class="outline" data-action="delete">Delete commission</button></p>`}else{actions.innerHTML=c.status==='submitted'?'<button class="btn" data-action="approve">Approve work</button> <button class="outline" data-action="revision">Request revision</button>':c.status==='approved'&&c.payment_status==='unpaid'?'<button class="btn" data-action="sent">Mark payment sent</button>':'<p class="muted">No action needed right now.</p>'}
actions.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{const a=b.dataset.action;if(a==='delete'){if(!confirm('Delete this commission permanently?'))return;await edge('commission-api',{action:'delete',id})}else{const payload={action:'update',id};if(a==='price')payload.price=Number($('#editPrice').value);if(a==='status')payload.status=$('#editStatus').value;if(a==='payment')payload.payment_status=$('#editPayment').value;if(a==='approve')payload.status='approved';if(a==='revision')payload.status='revision_requested';if(a==='sent')payload.payment_status='payment_sent';await edge('commission-api',payload)}close();await refresh()}catch(err){message(err)}});
document.querySelectorAll('[data-upload]').forEach(input=>input.onchange=async()=>{try{const f=input.files[0];if(!f)return;await upload(id,input.dataset.upload,f);await detail(id)}catch(err){message(err)}});
try{const data=await edge('commission-files-api',{action:'list',commission_id:id});if(!$('#assets'))return;files[id]=data.files||[];$('#assets').innerHTML=`<div class="eyebrow">PRIVATE FILES · ${files[id].length}</div>${files[id].map(f=>`<div class="row" style="margin-top:10px;gap:8px"><span class="muted" style="overflow-wrap:anywhere">${esc(f.file_name)} · ${esc(f.file_type)}</span><button class="outline" data-file="${f.id}">Open ↗</button></div>`).join('')}`;document.querySelectorAll('[data-file]').forEach(b=>b.onclick=async()=>{try{const r=await edge('commission-files-api',{action:'download_url',file_id:b.dataset.file});window.open(r.url,'_blank','noopener,noreferrer')}catch(err){message(err)}});const model=files[id].filter(f=>f.file_type==='3d_model').at(-1);if(model){const r=await edge('commission-files-api',{action:'download_url',file_id:model.id});if($('#viewer'))await showModel(r.url,model.file_name)}}catch(err){console.warn('Files unavailable',err)}}
async function showModel(url,name){clean();const el=$('#viewer');if(!el)return;let renderer,controls,raf,observer;try{const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,el.clientWidth/el.clientHeight,.01,10000);renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(el.clientWidth,el.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.innerHTML='';el.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x303030,3));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,6,7);scene.add(light);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const ext=name.split('.').pop().toLowerCase();let obj;if(ext==='glb'||ext==='gltf')obj=(await new GLTFLoader().loadAsync(url)).scene;else if(ext==='obj')obj=new OBJLoader().parse(await(await fetch(url)).text());else{const geo=new STLLoader().parse(await(await fetch(url)).arrayBuffer());obj=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xbdbdbd,side:THREE.DoubleSide}))}scene.add(obj);const box=new THREE.Box3().setFromObject(obj);if(box.isEmpty())throw Error('No geometry');const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),max=Math.max(size.x,size.y,size.z)||1;obj.position.sub(center);const dist=max/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.7;camera.position.set(dist*.7,dist*.45,dist);camera.near=.001;camera.far=dist*100;camera.updateProjectionMatrix();controls.update();const tick=()=>{raf=requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)};tick();observer=new ResizeObserver(()=>{if(!el.isConnected)return;camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight)});observer.observe(el);viewerCleanup=()=>{cancelAnimationFrame(raf);observer.disconnect();controls.dispose();renderer.dispose()}}catch(err){if(renderer)renderer.dispose();if(observer)observer.disconnect();el.innerHTML=`<div class="empty">Model preview unavailable: ${esc(err.message)}<p>Try a self-contained GLB file.</p></div>`}}
bootstrap();
</script></body></html>
